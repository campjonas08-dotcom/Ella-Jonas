<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Who's More Likely? 💕</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2226%22>💕</text></svg>" />
</head>
<body>

  <div class="bg-hearts" aria-hidden="true"></div>

  <main class="card">
    <header>
      <h1>Who's More Likely To…</h1>
      <p class="subtitle">Point at each other. Loser buys ice cream. 🍦</p>
    </header>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="question-box">
      <p class="question-count" id="questionCount">Question 1</p>
      <h2 class="question" id="questionText">Loading question…</h2>
    </section>

    <section class="answers" id="answers">
      <button class="answer-btn" data-answer="a">
        <span class="answer-emoji">🧑</span>
        <span class="answer-name" id="nameA">Jonas</span>
      </button>
      <button class="answer-btn" data-answer="b">
        <span class="answer-emoji">👩</span>
        <span class="answer-name" id="nameB">Ella</span>
      </button>
      <button class="answer-btn" data-answer="both">
        <span class="answer-emoji">🤝</span>
        <span class="answer-name">Both</span>
      </button>
      <button class="answer-btn" data-answer="neither">
        <span class="answer-emoji">🚫</span>
        <span class="answer-name">Neither</span>
      </button>
    </section>

    <div class="controls">
      <button class="ghost-btn" id="skipBtn">Skip ⏭</button>
      <button class="primary-btn" id="nextBtn" disabled>Next ➜</button>
    </div>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score" data-score="a">
        <span class="score-label" id="scoreLabelA">Jonas</span>
        <span class="score-value" id="scoreA">0</span>
      </div>
      <div class="score" data-score="b">
        <span class="score-label" id="scoreLabelB">Ella</span>
        <span class="score-value" id="scoreB">0</span>
      </div>
      <div class="score" data-score="both">
        <span class="score-label">Both</span>
        <span class="score-value" id="scoreBoth">0</span>
      </div>
      <div class="score" data-score="neither">
        <span class="score-label">Neither</span>
        <span class="score-value" id="scoreNeither">0</span>
      </div>
    </section>

    <button class="reset-link" id="resetBtn">Reset scores</button>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
