<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Who's More Likely? 💕</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2226%22>💕</text></svg>" />
</head>
<body>

  <div class="bg-hearts" aria-hidden="true"></div>

  <div class="player-picker hidden" id="playerPicker">
    <div class="player-picker-card">
      <h2>Who's playing?</h2>
      <p class="subtitle">Pick your name on this phone — it'll remember.</p>
      <div class="player-picker-buttons">
        <button class="player-btn" id="pickA">
          <span class="answer-emoji">🧑</span>
          <span class="player-btn-name">Jonas</span>
        </button>
        <button class="player-btn" id="pickB">
          <span class="answer-emoji">👩</span>
          <span class="player-btn-name">Ella</span>
        </button>
      </div>
    </div>
  </div>

  <main class="card">
    <header>
      <h1>Who's More Likely To…</h1>
      <p class="subtitle">Answer from anywhere, see it live. 🍦</p>
      <p class="player-indicator" id="playerIndicator">
        Playing as <strong id="currentPlayerName">…</strong> ·
        <button class="link-btn" id="switchPlayerBtn">switch</button>
      </p>
    </header>

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab" data-mode="likely">🤔 Likely</button>
      <button class="mode-tab" data-mode="fillblank">✏️ Fill in the Blank</button>
      <button class="mode-tab" data-mode="openended">💬 Open Ended</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="question-box">
      <p class="question-count" id="questionCount">Question 1</p>
      <h2 class="question" id="questionText">Loading question…</h2>
    </section>

    <section class="answers" id="answers">
      <button class="answer-btn" data-answer="a">
        <span class="answer-emoji">🧑</span>
        <span class="answer-name" id="nameA">Jonas</span>
      </button>
      <button class="answer-btn" data-answer="b">
        <span class="answer-emoji">👩</span>
        <span class="answer-name" id="nameB">Ella</span>
      </button>
      <button class="answer-btn" data-answer="both">
        <span class="answer-emoji">🤝</span>
        <span class="answer-name">Both</span>
      </button>
      <button class="answer-btn" data-answer="neither">
        <span class="answer-emoji">🚫</span>
        <span class="answer-name">Neither</span>
      </button>
    </section>

    <div class="text-answer-box hidden" id="textAnswerBox">
      <textarea id="textInput" class="text-input" placeholder="Type your answer…" rows="2"></textarea>
      <button class="primary-btn" id="submitTextBtn">Submit</button>
    </div>

    <p class="waiting-msg hidden" id="waitingMsg">
      <span class="pulse-dot"></span>
      <span id="waitingText">Waiting…</span>
    </p>

    <div class="reveal-box hidden" id="revealBox">
      <p class="reveal-row" id="revealA"></p>
      <p class="reveal-row" id="revealB"></p>
      <p class="match-banner" id="matchBanner"></p>
    </div>

    <div class="controls">
      <button class="ghost-btn" id="skipBtn">Skip ⏭</button>
      <button class="primary-btn" id="nextBtn" disabled>Next ➜</button>
    </div>

    <section class="scoreboard" id="scoreboard" aria-label="Scoreboard">
      <div class="score" data-score="a">
        <span class="score-label" id="scoreLabelA">Jonas</span>
        <span class="score-value" id="scoreA">0</span>
      </div>
      <div class="score" data-score="b">
        <span class="score-label" id="scoreLabelB">Ella</span>
        <span class="score-value" id="scoreB">0</span>
      </div>
      <div class="score" data-score="both">
        <span class="score-label">Both</span>
        <span class="score-value" id="scoreBoth">0</span>
      </div>
      <div class="score" data-score="neither">
        <span class="score-label">Neither</span>
        <span class="score-value" id="scoreNeither">0</span>
      </div>
    </section>

    <p class="match-stat" id="matchStat">0 / 0 matched</p>

    <button class="reset-link" id="resetBtn">Reset scores</button>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
